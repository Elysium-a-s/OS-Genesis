name: Build Genesis panel

on:
  pull_request:
    paths:
      - 'panel/**'
      - '.github/workflows/panel.yml'
  push:
    branches: [main]
    paths:
      - 'panel/**'
      - '.github/workflows/panel.yml'

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=web --org com.elysium.genesis .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn
      - name: Check the panel carries CanvasKit itself
        working-directory: panel
        shell: bash
        run: |
          set -euo pipefail
          # Panel kreslí cez CanvasKit. Bez `--no-web-resources-cdn` si ho beh
          # stiahne z gstatic.com — a domácnosť bez internetu potom nevidí nič,
          # hoci jednotka aj žiarovka sú na mieste a fungujú. Súbor je v obraze
          # tak či tak, išlo len o to, odkiaľ sa načíta.
          test -s build/web/canvaskit/canvaskit.wasm
          if grep -q 'gstatic.com/flutter-canvaskit' build/web/main.dart.js; then
            echo "panel by si CanvasKit sťahoval z CDN" >&2
            exit 1
          fi
          grep -q '"useLocalCanvasKit":true' build/web/flutter_bootstrap.js
      - uses: actions/upload-artifact@v4
        with:
          name: genesis-panel-web
          path: panel/build/web
          if-no-files-found: error
          retention-days: 14

  ipad-simulator:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Žiadne `flutter create`: iOS projekt je od ELYSIUM-360 verzovaný, takže
      # generovanie by prepísalo Info.plist aj bundle identifier — a výnimka pre
      # App Transport Security by zmizla bez toho, aby to niečo zahlásilo.
      - run: flutter pub get
      - run: flutter build ios --simulator --no-codesign
      # Overí, že sa v zostavenej aplikácii naozaj nachádza to, čo plist tvrdí.
      # `flutter test` kontroluje zdroj; toto kontroluje výsledok.
      - name: Check the built app carries the local-network exception
        run: |
          set -euo pipefail
          plist=build/ios/iphonesimulator/Runner.app/Info.plist
          test -f "$plist"
          /usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity:NSAllowsLocalNetworking' "$plist"
          /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = com.elysium.genesis.panel
          # Blanket výnimka by vypla TLS pre celú aplikáciu.
          if /usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity:NSAllowsArbitraryLoads' "$plist" 2>/dev/null; then
            echo "NSAllowsArbitraryLoads sa dostalo do buildu; výnimka má zostať na lokálnu sieť"
            exit 1
          fi
