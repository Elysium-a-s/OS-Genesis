name: Build Genesis HA app (ARM64)

on:
  pull_request:
    paths:
      - 'core/**'
      - 'ha-app/**'
      - 'panel/**'
      - 'repository.yaml'
      - '.github/workflows/ha-app.yml'
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'ha-app/**'
      - 'panel/**'
      - 'repository.yaml'
      - '.github/workflows/ha-app.yml'

permissions:
  contents: read
  packages: write

jobs:
  arm64-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build tested Flutter panel
        working-directory: panel
        run: |
          flutter create --platforms=web --org com.elysium.genesis .
          flutter pub get
          flutter analyze
          flutter test
          flutter build web --release
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Read the app image and version
        id: app
        shell: bash
        run: |
          set -euo pipefail
          # Supervisor sťahuje `<image>:<version>` presne podľa config.yaml, takže
          # oboje sa číta odtiaľ. Keby sa tu čokoľvek napísalo ručne, workflow a
          # app by sa rozišli a nikto by si to nevšimol skôr než pri inštalácii.
          config=ha-app/genesis/config.yaml
          image="$(sed -n 's/^image:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}[[:space:]]*$/\1/p' "$config")"
          version="$(sed -n 's/^version:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}[[:space:]]*$/\1/p' "$config")"
          test -n "$image" || { echo "config.yaml neuvádza image"; exit 1; }
          test -n "$version" || { echo "config.yaml neuvádza version"; exit 1; }
          # Prázdna alebo pokazená hodnota by sa inak publikovala ako značka.
          grep -Eq '^ghcr\.io/[a-z0-9._/-]+$' <<<"$image" \
            || { echo "image musí byť malými písmenami v ghcr.io: $image"; exit 1; }
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' <<<"$version" \
            || { echo "version musí byť X.Y.Z: $version"; exit 1; }
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Genesis HA app $image:$version"
      - name: Build ARM64 image
        run: |
          docker buildx build --platform linux/arm64 --load \
            --build-arg BUILD_VERSION='${{ steps.app.outputs.version }}' \
            --tag genesis-ha-pilot:ci --file ha-app/genesis/Dockerfile .
      - name: Check image and restart
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect genesis-ha-pilot:ci --format '{{.Architecture}}')" = arm64
          # Značka a `io.hass.version` musia hovoriť to isté; Supervisor verí verzii.
          test "$(docker image inspect genesis-ha-pilot:ci --format '{{index .Config.Labels "io.hass.version"}}')" = '${{ steps.app.outputs.version }}'
          mkdir -p "$RUNNER_TEMP/genesis-data"
          # Žiadne možnosti pre Behavior kanál: presne tak, ako app vyzerá po
          # čistej inštalácii. Prázdne hodnoty sa nesmú exportovať a jednotka
          # musí naštartovať.
          printf '%s\n' '{"read_token":"abcdefghijklmnopqrstuvwxyz012345","write_token":"ABCDEFGHIJKLMNOPQRSTUVWXYZ012345","sensitive_devices":"","behavior_key_id":"","behavior_secret":"","central_unit_id":""}' > "$RUNNER_TEMP/genesis-data/options.json"
          chmod 600 "$RUNNER_TEMP/genesis-data/options.json"
          container="$(docker run --platform linux/arm64 -d -e SUPERVISOR_TOKEN=ci-placeholder -e GENESIS_INGRESS_ONLY=false -v "$RUNNER_TEMP/genesis-data:/data" -p 127.0.0.1:18765:8080 genesis-ha-pilot:ci)"
          trap 'docker logs "$container"; docker rm -f "$container" >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18765/health >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18765/health
          curl --fail --silent http://127.0.0.1:18765/ | grep -q flutter_bootstrap.js
          curl --fail --silent -H 'X-Ingress-Path: /api/hassio_ingress/pilot' http://127.0.0.1:18765/ | grep -q '<base href="/api/hassio_ingress/pilot/">'
          curl --fail --silent http://127.0.0.1:18765/flutter_bootstrap.js >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18765/v1/missing)" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18765/v1/devices)" = 401
          test "$(curl --silent --header 'Authorization: Bearer abcdefghijklmnopqrstuvwxyz012345' http://127.0.0.1:18765/v1/devices)" = "[]"
          # Záloha je od 0.1.4 zapnutá v app. Dovtedy bol kód v obraze a
          # endpoint odpovedal 503, pretože run.sh GENESIS_BACKUP_DIR nenastavil.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST --header 'Authorization: Bearer ABCDEFGHIJKLMNOPQRSTUVWXYZ012345' http://127.0.0.1:18765/v1/backup)" = 201
          test -n "$(ls "$RUNNER_TEMP/genesis-data/backups/")"
          # Nenastavený Behavior kanál je vlastný stav, nie pád pri štarte: app
          # bez tých možností musí bežať a endpoint to má povedať menom.
          curl --silent --request POST --header 'Content-Type: application/json' --data '{}' http://127.0.0.1:18765/v1/behavior/decisions | grep -q behavior_channel_not_configured
          docker restart --time 3 "$container" >/dev/null
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18765/health >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18765/health
          test -s "$RUNNER_TEMP/genesis-data/genesis-ledger.sqlite3"
          docker stats --no-stream --format '{{.MemUsage}} {{.CPUPerc}}' "$container"
      - name: Check the Behavior channel comes up when it is configured
        shell: bash
        run: |
          set -euo pipefail
          # Druhý kontajner s nastavenými možnosťami. Bez tohto by sa dalo vydať
          # app, v ktorej je kanál navždy tmavý — presne to bol stav do 0.1.3.
          mkdir -p "$RUNNER_TEMP/genesis-behavior"
          printf '%s\n' '{"read_token":"abcdefghijklmnopqrstuvwxyz012345","write_token":"ABCDEFGHIJKLMNOPQRSTUVWXYZ012345","behavior_key_id":"ci-key","behavior_secret":"ci-behavior-secret-of-32-chars-min","central_unit_id":"ad19a578-21e2-453f-a57c-1913350be34e"}' > "$RUNNER_TEMP/genesis-behavior/options.json"
          chmod 600 "$RUNNER_TEMP/genesis-behavior/options.json"
          container="$(docker run --platform linux/arm64 -d -e SUPERVISOR_TOKEN=ci-placeholder -e GENESIS_INGRESS_ONLY=false -v "$RUNNER_TEMP/genesis-behavior:/data" -p 127.0.0.1:18766:8080 genesis-ha-pilot:ci)"
          trap 'docker logs "$container"; docker rm -f "$container" >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18766/health >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18766/health
          # Kanál je nastavený, takže sa už neodmieta pre chýbajúcu konfiguráciu;
          # nepodpísané telo padne na podpise, čo je správny dôvod.
          body="$(curl --silent --request POST --header 'Content-Type: application/json' --data '{}' http://127.0.0.1:18766/v1/behavior/decisions)"
          ! grep -q behavior_channel_not_configured <<<"$body"
          # Tajomstvo ani kľúč sa nesmú dostať do logu app.
          ! docker logs "$container" 2>&1 | grep -q ci-behavior-secret-of-32-chars-min

      - name: Save image archive
        run: docker save genesis-ha-pilot:ci | gzip -1 > "$RUNNER_TEMP/genesis-ha-pilot-arm64.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: genesis-ha-pilot-arm64
          path: ${{ runner.temp }}/genesis-ha-pilot-arm64.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        if: github.event_name == 'push'
        shell: bash
        env:
          IMAGE: ${{ steps.app.outputs.image }}
          VERSION: ${{ steps.app.outputs.version }}
        run: |
          set -euo pipefail
          # Publikuje sa presne ten obraz, ktorý vyššie prešiel smoke testom —
          # preto `docker tag` a nie druhý build. Znovu zostavený obraz by nebol
          # ten istý, ktorý sme overili.
          commit="sha-${GITHUB_SHA::7}"
          docker tag genesis-ha-pilot:ci "$IMAGE:$commit"
          docker push "$IMAGE:$commit"
          echo "- nemenná značka: \`$IMAGE:$commit\`" >> "$GITHUB_STEP_SUMMARY"

          # Značku verzie sa nikdy neprepisuje. Supervisor rozhoduje o aktualizácii
          # podľa čísla verzie, takže vymeniť obsah pod tým istým číslom znamená, že
          # prevádzkovateľ opravu nikdy nedostane — jednotka si bude myslieť, že je
          # aktuálna. Ak verzia už existuje, treba ju v config.yaml zvýšiť.
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "::warning::$IMAGE:$VERSION už v registri je; značka verzie sa neposunula. Pre vydanie zvýš version v ha-app/genesis/config.yaml."
            echo "- značka verzie \`$VERSION\` **neposunutá** (v registri už je) — pre vydanie zvýš \`version\` v \`ha-app/genesis/config.yaml\`" >> "$GITHUB_STEP_SUMMARY"
          else
            docker tag genesis-ha-pilot:ci "$IMAGE:$VERSION"
            docker push "$IMAGE:$VERSION"
            echo "- vydaná značka: \`$IMAGE:$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          fi
