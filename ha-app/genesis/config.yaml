name: OS Genesis Pilot
slug: genesis_pilot
version: "0.1.0"
description: Pilotná centrálna služba Genesis pre Home Assistant Green
url: https://github.com/Elysium-a-s/OS-Genesis
arch:
  - aarch64
stage: experimental
startup: application
boot: auto
homeassistant_api: true
image: ghcr.io/elysium-a-s/os-genesis-pilot
ports:
  8080/tcp: 8765
ports_description:
  8080/tcp: Genesis panel a API v domácej sieti
webui: http://[HOST]:[PORT:8080]/
watchdog: http://[HOST]:[PORT:8080]/health
options:
  read_token: null
  write_token: null
  member_token: null
  guest_token: null
schema:
  read_token: password
  write_token: password
  member_token: password?
  guest_token: password?
